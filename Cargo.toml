[package]
name = "contextkit"
version = "1.0.0"
edition = "2024"
rust-version = "1.91"
description = "Local-first context and persistent memory layer for AI coding assistants, exposed over the Model Context Protocol."
license = "MIT"
readme = "README.md"
keywords = ["mcp", "ai", "context", "code-search", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/fuzz"]

[[bin]]
name = "contextkit"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
blake3 = "1.8.8"
clap = { version = "4.6.10", features = ["derive", "env"] }
ignore = "0.4.35"
notify = "9.0.0"
regex = "1.13.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
toml = "1.2.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
tree-sitter = "0.27.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-lua = "0.5.0"
tree-sitter-luau = "1.2.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
uuid = { version = "1.29.3", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

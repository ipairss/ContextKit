[package]
name = "contextkit-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
contextkit = { path = ".." }
libfuzzer-sys = "0.4"
tempfile = "3"

# Not part of the main crate's workspace.
[workspace]
members = ["."]

[[bin]]
name = "mcp_message"
path = "fuzz_targets/mcp_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "extract"
path = "fuzz_targets/extract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "search_query"
path = "fuzz_targets/search_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paths"
path = "fuzz_targets/paths.rs"
test = false
doc = false
bench = false
